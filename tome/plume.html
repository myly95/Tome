<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plume | Atelier Tòme</title>
<meta name="description" content="Plume, le traitement de texte de Tòme : mise en forme, images, tableaux, export Word et PDF.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tome.css">
</head>
<body>
<div class="app" data-role="">
  <aside class="sidebar">
    <a href="index.html" class="logo"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true" width="30" height="30">
        <rect x="4" y="5" width="7" height="23" rx="1.5" fill="currentColor"/>
        <rect x="12.5" y="8" width="6" height="20" rx="1.5" fill="var(--accent)"/>
        <rect x="20" y="4" width="8" height="24" rx="1.5" transform="rotate(8 24 16)" fill="var(--gold)"/>
      </svg> Tòme</a>
    <nav>
      <a href="mon-espace"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Mon espace</a><a href="messagerie.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>Messagerie</a><div class="group">Atelier</div><a href="atelier.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/></svg>Accueil de l'Atelier</a><a href="atelier-code.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/></svg>Code</a><a href="abaque.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Abaque et Mesure</a><a href="plume.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Plume</a><div class="group">Ressources</div><a href="encyclopedie.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2"/><path d="M19 19v3H6a2 2 0 0 1-2-2"/></svg>Encyclopédie</a>
    </nav>
    <div class="me">
      <div class="avatar" data-user-initials>IN</div>
      <div class="who"><strong data-user-name>Invité</strong><span data-user-role></span><span class="addr" data-user-address></span></div>
      <button data-logout aria-label="Se déconnecter" title="Se déconnecter"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
  </aside>
  <main class="main">
    <div class="ab-top no-print">
      <button class="app-menu" data-app-menu aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="ab-brand"><span class="eyebrow"><a href="atelier.html">Atelier</a> · Plume</span><input id="doc-title" class="nb-title ab-title" aria-label="Titre du document" spellcheck="false"></div>
      <span class="small" id="doc-count"></span>
    </div>

    <nav class="ab-menus no-print" aria-label="Menus">
      <div class="menu"><button>Fichier</button><div class="menu-pop">
        <button data-action="nouveau">Nouveau document</button>
        <button data-action="ouvrir">Ouvrir un fichier… <kbd>.plm .docx .txt .md</kbd></button>
        <button data-action="docs">Mes documents</button>
        <hr>
        <button data-action="plm">Enregistrer (.plm) <kbd>Ctrl S</kbd></button>
        <button data-action="docx">Exporter en Word (.docx)</button>
        <button data-action="pdf">Exporter en PDF (imprimer)</button>
        <button data-action="html">Exporter en page web (.html)</button>
        <hr>
        <button data-action="espace">Sauvegarder dans mon espace Tòme</button>
      </div></div>
    </nav>

    <div class="pl-tools no-print" role="toolbar" aria-label="Mise en forme">
      <select id="block-style" class="tbtn" aria-label="Style du paragraphe">
        <option value="p">Paragraphe</option><option value="h1">Titre 1</option><option value="h2">Titre 2</option><option value="h3">Titre 3</option><option value="blockquote">Citation</option>
      </select>
      <span class="sep"></span>
      <button class="tbtn icon" data-cmd="bold" title="Gras (Ctrl B)"><b>G</b></button>
      <button class="tbtn icon" data-cmd="italic" title="Italique (Ctrl I)"><i>I</i></button>
      <button class="tbtn icon" data-cmd="underline" title="Souligné (Ctrl U)"><u>S</u></button>
      <button class="tbtn icon" data-cmd="strikeThrough" title="Barré"><s>ab</s></button>
      <label class="tbtn icon color" title="Couleur du texte"><input type="color" id="fore-color" value="#b5442c"><span style="border-bottom:3px solid var(--accent)">A</span></label>
      <label class="tbtn icon color" title="Surligner"><input type="color" id="hilite-color" value="#fff3c4"><span>▣</span></label>
      <span class="sep"></span>
      <button class="tbtn icon" data-cmd="insertUnorderedList" title="Liste à puces">•≡</button>
      <button class="tbtn icon" data-cmd="insertOrderedList" title="Liste numérotée">1≡</button>
      <button class="tbtn icon" data-cmd="justifyLeft" title="Aligner à gauche">⇤</button>
      <button class="tbtn icon" data-cmd="justifyCenter" title="Centrer">↔</button>
      <button class="tbtn icon" data-cmd="justifyRight" title="Aligner à droite">⇥</button>
      <button class="tbtn icon" data-cmd="justifyFull" title="Justifier">☰</button>
      <span class="sep"></span>
      <button class="tbtn" id="btn-link" title="Insérer un lien">Lien</button>
      <button class="tbtn" id="btn-image" title="Insérer une image">Image</button>
      <button class="tbtn" id="btn-table" title="Insérer un tableau">Tableau</button>
      <button class="tbtn" id="btn-pagebreak" title="Saut de page">Saut de page</button>
      <button class="tbtn" id="btn-clear" title="Effacer la mise en forme">Effacer le format</button>
      <span class="sep"></span>
      <button class="tbtn icon" data-cmd="undo" title="Annuler (Ctrl Z)">↶</button>
      <button class="tbtn icon" data-cmd="redo" title="Rétablir (Ctrl Y)">↷</button>
    </div>

    <div class="pl-desk">
      <article class="pl-page" id="editor" contenteditable="true" spellcheck="true" lang="fr" aria-label="Document"></article>
    </div>

    <input type="file" id="open-file" accept=".plm,.docx,.txt,.md,.html,.htm" hidden>
    <input type="file" id="image-file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>

    <dialog class="dlg" id="dlg-docs" aria-labelledby="dlg-docs-t">
      <div class="dlg-head"><h2 id="dlg-docs-t">Mes documents</h2><button data-close aria-label="Fermer">×</button></div>
      <div class="dlg-body">
        <div><h3>Sur cet appareil</h3><div class="nb-list" id="docs-local" style="margin-top:10px;"></div></div>
        <div><h3>Dans mon espace Tòme</h3><div class="nb-list" id="docs-espace" style="margin-top:10px;"></div></div>
      </div>
    </dialog>
<script src="js/plume.js" defer></script>

  </main>
</div>

<script src="js/tome.js"></script>
</body>
</html>
